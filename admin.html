<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración - Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .table-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
   
    /* Lo que está dentro de @media print SOLO se aplica al imprimir */
    @media print {
      body { background-color: white; }
      .no-imprimir { display: none !important; } /* Oculta botones y filtros */
      .table-container { box-shadow: none; padding: 0; border: none; }
      .table { border: 2px solid black; }
      h2 { color: black !important; text-align: center; font-size: 24pt; margin-bottom: 20px;}
    }
  </style>
</head>
<body>
  <div class="container py-4">
   
    <!-- Encabezado que se oculta al imprimir -->
    <div class="d-flex justify-content-between align-items-center mb-4 no-imprimir">
      <h3 class="fw-bold text-primary">Control de Entrega de Equipos</h3>
      <div>
        <button class="btn btn-success btn-lg" onclick="window.print()">🖨️ Imprimir Planilla</button>
      </div>
    </div>

    <!-- Filtro de fecha (oculto al imprimir) -->
    <div class="card mb-4 no-imprimir">
      <div class="card-body d-flex align-items-center gap-3">
        <label class="fw-bold mb-0">Ver reservas del día:</label>
        <input type="date" class="form-control w-auto" id="fechaAdmin" onchange="cargarPlanilla()">
        <div id="loader" class="spinner-border text-primary ms-3" role="status" style="display: none; width: 1.5rem; height: 1.5rem;"></div>
      </div>
    </div>

    <!-- Planilla a imprimir -->
    <div class="table-container" id="zonaImpresion">
      <h2 class="d-none d-print-block">Planilla de Entrega de Equipos - Fecha: <span id="fechaTitulo"></span></h2>
     
      <table class="table table-bordered table-striped mt-3">
        <thead class="table-dark">
          <tr>
            <th style="width: 20%;">Módulo Horario</th>
            <th style="width: 15%;">Equipo / ID</th>
            <th style="width: 15%;">Categoría (Tipo)</th>
            <th style="width: 20%;">Profesor</th>
            <th style="width: 15%;">Curso/Materia</th>
            <th style="width: 15%;">Firma de Recepción</th>
          </tr>
        </thead>
        <tbody id="tablaReservas">
          <tr><td colspan="6" class="text-center py-4">Selecciona una fecha para ver las reservas</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    window.onload = function() {
      // Ajustar la fecha a la zona horaria local (GMT-3, Argentina)
      const hoy = new Date();
      hoy.setMinutes(hoy.getMinutes() - hoy.getTimezoneOffset());
      const fechaLocal = hoy.toISOString().split("T")[0];
     
      document.getElementById('fechaAdmin').value = fechaLocal;
      cargarPlanilla();
    };

    function cargarPlanilla() {
      const fecha = document.getElementById('fechaAdmin').value;
      if (!fecha) return;

      const partesFecha = fecha.split("-");
      document.getElementById('fechaTitulo').innerText = `${partesFecha[2]}/${partesFecha[1]}/${partesFecha[0]}`;

      document.getElementById('loader').style.display = 'block';
      document.getElementById('tablaReservas').innerHTML = '<tr><td colspan="6" class="text-center text-muted">Cargando datos...</td></tr>';

      google.script.run
        .withSuccessHandler(mostrarTabla)
        .withFailureHandler(err => {
          alert("Error al cargar: " + err.message);
          document.getElementById('loader').style.display = 'none';
        })
        .obtenerReservasDelDia(fecha);
    }

    function mostrarTabla(reservas) {
      document.getElementById('loader').style.display = 'none';
      const tbody = document.getElementById('tablaReservas');
     
      if (reservas.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center fw-bold py-4 text-danger">No hay reservas para esta fecha.</td></tr>';
        return;
      }

      let html = '';
      reservas.forEach(res => {
        html += `
          <tr>
            <td class="align-middle fw-bold">${res.tramo}</td>
            <td class="align-middle text-primary fw-bold">${res.id_adm}</td>
            <td class="align-middle">${res.tipo}</td>
            <td class="align-middle">${res.profesor}</td>
            <td class="align-middle">${res.curso}</td>
            <td class="align-middle"></td> <!-- Espacio en blanco para firmar -->
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }
  </script>
</body>
</html>
